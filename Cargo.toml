[package]
name = "laplace-terminal"
version = "0.1.0"
edition = "2021"
description = "Minimal GPU terminal: <15MB RAM, 0% idle CPU (Metal on macOS, Vulkan on Linux)"

[[bin]]
name = "laplace"
path = "src/main.rs"

[dependencies]
fontdue = "0.9"
vte = "0.13"
libc = "0.2"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
pollster = "0.4"

# Phase 5: OS-specific windowing and GPU backends only (Metal on macOS, Vulkan on Linux).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "vulkan-portability"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
